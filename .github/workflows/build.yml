name: Build weekly content

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: weekly-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Translate missing posts
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: node scripts/translate_posts.js

      - name: Regenerate and verify content
        run: |
          pnpm sync:content
          pnpm test:unit
          pnpm check:content

      - name: Commit and push if changed
        run: |
          # 设置分支名称变量
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"

          git config user.email "tw93@qq.com"
          git config user.name "Tw93-bot"

          # 只暂存这条内容管线拥有的翻译与生成物
          git add src/pages/en/posts/ README.md RECENT.md public/posts.json public/skills/weekly-issues/SKILL.md

          # 检查是否有变更
          if git diff-index --quiet HEAD --; then
            echo "No changes detected"
          else
            git commit -m "Updated content"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Ping IndexNow
        run: |
          KEY="6ff2b87724ac930114bf05c74db50bb5"
          HOST="weekly.tw93.fun"

          URLS=$(git diff --name-only HEAD~1 HEAD -- 'src/pages/posts/*.md' | while read f; do
            slug=$(basename "$f" .md)
            echo "https://$HOST/posts/$slug"
          done)

          if [ -z "$URLS" ]; then
            echo "No post URLs changed, submitting homepage"
            URLS="https://$HOST/"
          fi

          URL_LIST=$(echo "$URLS" | jq -R -s 'split("\n") | map(select(length > 0))')
          echo "Submitting to IndexNow: $URL_LIST"

          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$URL_LIST}"
